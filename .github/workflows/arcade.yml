name: Arcade graphics

# Rebuilds the live profile graphics and publishes them to the `output` branch,
# which README.md loads them from.
on:
  schedule:
    - cron: "23 */12 * * *" # twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/arcade.yml"

permissions:
  contents: write

concurrency:
  group: arcade
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Commit Stack + Player Stats
        run: python scripts/arcade.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#1C2144,#3E318A,#6246C9,#9277F5,#D4C8FF
            dist/snake-light.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#DDD6FE,#C4B5FD,#8B5CF6,#6D28D9

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Refresh arcade graphics"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
